[package]
name = "charterm"
version = "0.4.0"
description = "One Terminal. Every Connection."
authors = ["Charlie M. Chavez"]
license-file = "../LICENSE.md"
edition = "2021"

[lib]
name = "charterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
portable-pty = "0.9"
serialport = { version = "4", default-features = false }
keyring = "4.2"
zeroize = "1"
quick-xml = "0.38"

